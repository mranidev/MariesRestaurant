name: maries-restaurant
owner: elalaoui
package: .
locality:
  regions:
  - fr-roub1
env:
  APP_NAME: Maries
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: https://maries-restaurant.wasmer.app
  DB_CONNECTION: mysql
  DB_PREFIX: ti_
  DB_ALLOW_NO_PRIMARY_KEY: 'true'
  # DB-backed cache/sessions: the sandbox filesystem is ephemeral per
  # instance, so file-based storage breaks CSRF/combiner caching across
  # requests. Both tables exist in the managed MySQL DB.
  CACHE_DRIVER: database
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: database
  # No mail server is configured on Edge; log outgoing mail instead of
  # failing (order emails previously errored with "530 Authentication required").
  MAIL_MAILER: log
  SESSION_LIFETIME: '120'
  LOG_CHANNEL: stderr
  BROADCAST_DRIVER: log
  IGNITER_LOCATION_MODE: single
capabilities:
  instaboot:
    mode: null
    requests:
    - path: /
  database:
    engine: mysql
debug: false
scaling:
  mode: single_concurrency
kind: wasmer.io/App.v0
